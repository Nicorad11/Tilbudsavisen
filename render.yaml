# Render Blueprint – én webservice (API, cron-jobs og frontend) og en Postgres-database,
# begge i Frankfurt (EU). Opret med "New → Blueprint" på dashboard.render.com.
# Værdier med "sync: false" udfyldes i Render, når blueprintet oprettes – de står
# aldrig i Git. Se LAUNCH_CHECKLIST.md for rækkefølgen.

databases:
  - name: tilbudsradar-db
    region: frankfurt
    plan: basic-256mb
    databaseName: tilbudsradar
    user: tilbudsradar
    postgresMajorVersion: "17"
    ipAllowList: [] # kun adgang fra Render-tjenester

services:
  - type: web
    name: tilbudsradar
    runtime: docker
    region: frankfurt
    # Mindst "starter": gratis-instanser sover, og så kører cron-jobs (scraping,
    # mails om prøveperioden) ikke.
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    # Render tilføjer selv www.tilbudsradaren.dk med omdirigering til domænet.
    # admin.tilbudsradaren.dk er admin-appen (overblik, kunder, kilder) – samme service.
    domains:
      - tilbudsradaren.dk
      - admin.tilbudsradaren.dk
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://tilbudsradaren.dk
      - key: CORS_ORIGINS
        value: https://tilbudsradaren.dk
      - key: DATABASE_URL
        fromDatabase:
          name: tilbudsradar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Din egen e-mail – giver fuld adgang og styring af kilderne.
      - key: ADMIN_EMAILS
        sync: false

      # Virksomheden – vises i footer, på /om, i betingelserne og i e-mails.
      # Tomme felter vises som [UDFYLD: …], indtil de er sat.
      - key: COMPANY_NAME
        sync: false
      - key: COMPANY_CVR
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: CONTACT_EMAIL
        value: kontakt@tilbudsradaren.dk
      - key: VITE_INSTAGRAM_URL
        sync: false

      - key: MAIL_FROM
        value: Tilbudsradar <noreply@tilbudsradaren.dk>
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: RECEIPT_SCANS_PER_MONTH
        value: "20"

      # Tilføjes senere under Environment i Render, når de er klar
      # (se LAUNCH_CHECKLIST.md):
      #   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_ID  – samlet
      #   STRIPE_PORTAL_CONFIG_ID, STRIPE_TAX_RATE_ID                – valgfri
      #   SMTP_URL                                                   – e-mail
      #   ANTHROPIC_API_KEY                                          – kvitteringer med Claude
      #   SENTRY_DSN, VITE_SENTRY_DSN, VITE_PLAUSIBLE_DOMAIN         – drift
      #   SLACK_WEBHOOK_URL, ALERT_EMAIL_TO                          – scraper-alarmer
